name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds, signs and notarizes with a read-only token; only release below can write
  build:
    runs-on: macos-26
    # Two notarytool waits of up to 30 minutes each, plus the build
    timeout-minutes: 90
    env:
      # A missing or untrusted identity fails the job instead of shipping an unsigned DMG
      MACOS_SIGN_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against origin/main
          fetch-depth: 0
      # No version input: it reads package.json's packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: brew install shellcheck jq
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
      - name: Check the tag, the changelog and the release secrets
        env:
          HAS_SECRETS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME differs from package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main"
            exit 1
          fi
          changelog=$(awk '/^## /{print $2; exit}' CHANGELOG.md)
          if [ "$changelog" != "$version" ]; then
            echo "::error::the top CHANGELOG.md heading is $changelog, not $version"
            exit 1
          fi
          if [ "$HAS_SECRETS" != true ]; then
            echo "::error::MACOS_CERT_P12, MACOS_CERT_PASSWORD and the three APPLE_API_* secrets are all required to publish a signed, notarized DMG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # The runner's bash is 3.2, so no mapfile.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"\(.*\)"$/\1/')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$P12"
      - name: Build, sign and notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: Upload the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The cask pins the published DMG's sha256, so an asset is never replaced. A rebuild
          # is not byte-identical, so a leftover .sha256 would not match a new DMG either.
          if existing=$(gh release view "$TAG" --json assets -q '.assets[].name'); then
            for f in dist/*.dmg dist/*.sha256; do
              if grep -qxF "$(basename "$f")" <<< "$existing"; then
                echo "::error::release $TAG already has $(basename "$f"); delete the asset by hand to republish"
                exit 1
              fi
            done
            gh release upload "$TAG" dist/*.dmg dist/*.sha256
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 --generate-notes
          fi
